name: Crypto Alert Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python crypto_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save bot state (open trades + daily stats)
        if: always()
        run: |
          git config user.name "crypto-bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add crypto_state.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "bot state update"
          git pull --rebase
          git push
